<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340"><rect width="1200" height="340" fill="#151923"/><g fill="#f1f4f8" font-family="monospace" font-size="18"><text x="24" y="68">Q6 - AODV Route Discovery (RREQ / RREP)</text><text x="24" y="102">S broadcasts RREQ for D</text><text x="24" y="136">S forwards RREQ to A and B</text><text x="24" y="170">A forwards RREQ to D</text><text x="24" y="204">D sends RREP along reverse path: D -&gt; A -&gt; S</text><text x="24" y="238">Installed route: S -&gt; A -&gt; D</text><text x="24" y="272">AODV: reactive, route discovery on demand.</text><text x="24" y="306">DSDV: proactive, routing tables continuously updated.</text></g></svg>