<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="477" viewBox="0 0 1500 477"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4A Task 1 – Android Architecture Diagnosis — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4A TASK 1 - ANDROID ARCHITECTURE</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">1. Hardware: CPU, RAM, modem, sensors</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">2. Linux kernel/drivers: scheduler, memory, network, drivers, Binder</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">3. HAL: vendor hardware interfaces</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">4. Native libraries/services: graphics, media, SQLite, TLS, system services</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">5. ART: DEX verification, interpreter, JIT/AOT, heap/GC</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">6. Application framework: Activity, Service, permissions, notifications</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">7. Applications: UI, business logic, data, network</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15">CALL TRACE</text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15"> -&gt; App calls framework API</text><text x="28" y="325" fill="#edf2f7" font-family="monospace" font-size="15"> -&gt; Framework calls service through Binder</text><text x="28" y="348" fill="#edf2f7" font-family="monospace" font-size="15"> -&gt; Service checks caller identity and permissions</text><text x="28" y="371" fill="#edf2f7" font-family="monospace" font-size="15"> -&gt; Service accesses HAL/native library or kernel interface</text><text x="28" y="394" fill="#edf2f7" font-family="monospace" font-size="15"> -&gt; Kernel validates access and controls hardware</text><text x="28" y="417" fill="#edf2f7" font-family="monospace" font-size="15">Security: UID isolation, SELinux and framework permission checks.</text><text x="28" y="440" fill="#edf2f7" font-family="monospace" font-size="15">Power: PowerManager coordinated with wakelocks, suspend and CPU frequency controls.</text></svg>