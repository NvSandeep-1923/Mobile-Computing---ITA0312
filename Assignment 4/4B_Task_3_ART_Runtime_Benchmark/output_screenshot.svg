<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="293" viewBox="0 0 1500 293"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4B Task 3 – ART Runtime Benchmark — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4B TASK 3 - RUNTIME BENCHMARK</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">CPU primes under 5000 and allocation of 50000 objects: five timed runs; median and samples printed.</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">ADB ART commands:</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">adb shell dumpsys package com.example.benchmark</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">adb shell cmd package compile -m speed-profile -f com.example.benchmark</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">adb shell cmd package get-compile-status com.example.benchmark</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">adb logcat | grep -i -E 'art|gc'</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">adb shell am force-stop com.example.benchmark</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">Host benchmark only; it does not alter ART modes or measure Android GC.</text></svg>