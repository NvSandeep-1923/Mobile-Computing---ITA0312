<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="431" viewBox="0 0 1500 431"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4A Task 2 – Secure Messaging OS Comparison — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4A TASK 2 - SECURE MESSAGING</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">Android: FCM/system push; Doze and background limits</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">iOS: APNs/system push; Background App Refresh and notification type</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">Windows: Push notification service; package and OS background task policy</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">SCREEN-OFF TRACE</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">1. Network stack receives packet</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">2. System push service receives notification</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">3. OS checks payload type and background policy</text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15">4. Eligible callback or visible notification is dispatched</text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15">5. App stores encrypted message metadata</text><text x="28" y="325" fill="#edf2f7" font-family="monospace" font-size="15">6. User opens notification and fetches authenticated content</text><text x="28" y="348" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="371" fill="#edf2f7" font-family="monospace" font-size="15">KILLED PROCESS: visible push may still display; silent callback is not guaranteed.</text><text x="28" y="394" fill="#edf2f7" font-family="monospace" font-size="15">Use server-side durable queue, authenticated fetch and idempotent processing.</text></svg>