<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="260" viewBox="0 0 1500 260"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4A Task 6 – RuralCare Offline-First Design — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4A TASK 6 - RURALCARE OFFLINE-FIRST</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">Queued UUID records with sequence number, payload hash and PENDING state.</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">Sync test: server commits first UUID; acknowledgement is lost; client retries same UUID.</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">Retry returns existing acknowledgement: ACK-0001</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">Server logical record count: 1</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">A/B: encrypted durable queue. C: minimal safe data only; block sensitive offline capture if secure storage is absent.</text></svg>