<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="408" viewBox="0 0 1500 408"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4A Task 4 – Mobile Application Security — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4A TASK 4 - SECURITY DEFECTS AND REPAIRS</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">1. Request all permissions up front</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">   Repair: Request dangerous permission in context; least privilege</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">2. Token in shared readable file</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">   Repair: Use app-private encrypted storage and Keystore-backed key</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">3. Updates from any source</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">   Repair: Verify trusted distribution and package signing identity</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">4. Plain HTTP</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">   Repair: Enforce HTTPS/TLS, validate certificate, disable cleartext</text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15">REGRESSION: request contacts only when user selects contact feature.</text><text x="28" y="325" fill="#edf2f7" font-family="monospace" font-size="15">Denied permission must not block unrelated note creation.</text><text x="28" y="348" fill="#edf2f7" font-family="monospace" font-size="15">Confidentiality first fails when malicious app reads the shared token file.</text><text x="28" y="371" fill="#edf2f7" font-family="monospace" font-size="15">No exploit is executed; this is a safe local audit model.</text></svg>