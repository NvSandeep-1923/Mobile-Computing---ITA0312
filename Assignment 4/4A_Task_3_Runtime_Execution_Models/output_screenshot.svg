<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="431" viewBox="0 0 1500 431"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4A Task 3 – Runtime Execution Models — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4A TASK 3 - RUNTIME MODELS</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">Android ART: DEX; interpretation + JIT + profile-guided AOT; managed heap / GC</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">iOS: signed Mach-O; native compiled code; ARC reference counting</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">Windows: .NET assembly or PE; CLR JIT or native code; CLR GC / native ownership</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15">ANDROID COLD START</text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">1. Launcher requests Activity</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">2. ActivityTaskManager resolves component</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">3. Zygote forks isolated process</text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15">4. ART maps/verifies DEX and initialises heap</text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15">5. Application object is created</text><text x="28" y="325" fill="#edf2f7" font-family="monospace" font-size="15">6. Activity lifecycle callback runs</text><text x="28" y="348" fill="#edf2f7" font-family="monospace" font-size="15">7. UI layout and rendering occur</text><text x="28" y="371" fill="#edf2f7" font-family="monospace" font-size="15">8. First frame is displayed</text><text x="28" y="394" fill="#edf2f7" font-family="monospace" font-size="15">Warm start can reuse a live process; a killed process requires process initialisation.</text></svg>