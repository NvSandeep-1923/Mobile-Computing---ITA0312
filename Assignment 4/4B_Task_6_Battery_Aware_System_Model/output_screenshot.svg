<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="339" viewBox="0 0 1500 339"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4B Task 6 – Battery-Aware System Model — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4B TASK 6 - BATTERY-AWARE SYSTEM MODEL</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">Normal Wi-Fi =&gt; NORMAL sampling; batch upload</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">Low battery =&gt; CRITICAL; minimum safe sampling; defer unless urgent</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">Offline =&gt; OFFLINE; local queue; sync after reconnect</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">Emergency =&gt; EMERGENCY; high-priority alert immediately</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">VALIDATION</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">Normal: batch upload on Wi-Fi. Low: reduce non-urgent work.</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">Offline: persist records and retry idempotently after connection returns.</text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15">Emergency: override power-saving delay for priority alert.</text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15">5,000 devices: server queues, partitions, rate limits, jittered retry and priority lanes.</text></svg>