<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="408" viewBox="0 0 1500 408"><rect width="100%" height="100%" fill="#151923"/><text x="28" y="36" fill="#82c4ff" font-family="monospace" font-size="21">4B Task 1 – Android Process and Memory Observation — console capture</text><text x="28" y="72" fill="#edf2f7" font-family="monospace" font-size="15">4B TASK 1 - PROCESS/MEMORY OBSERVATION TEMPLATE</text><text x="28" y="95" fill="#edf2f7" font-family="monospace" font-size="15">Host OS and PID are shown by local execution; they are not Android PID/UID/PSS evidence.</text><text x="28" y="118" fill="#edf2f7" font-family="monospace" font-size="15">Foreground: onResume; low kill priority</text><text x="28" y="141" fill="#edf2f7" font-family="monospace" font-size="15">Background 5 min: onStop / cached; may be trimmed</text><text x="28" y="164" fill="#edf2f7" font-family="monospace" font-size="15">Low-memory trim: onTrimMemory may occur; process may be killed</text><text x="28" y="187" fill="#edf2f7" font-family="monospace" font-size="15"></text><text x="28" y="210" fill="#edf2f7" font-family="monospace" font-size="15">RUN ON ANDROID DEVICE:</text><text x="28" y="233" fill="#edf2f7" font-family="monospace" font-size="15">adb shell getprop ro.build.version.release</text><text x="28" y="256" fill="#edf2f7" font-family="monospace" font-size="15">adb shell ps -A</text><text x="28" y="279" fill="#edf2f7" font-family="monospace" font-size="15">adb shell dumpsys activity processes</text><text x="28" y="302" fill="#edf2f7" font-family="monospace" font-size="15">adb shell dumpsys meminfo &lt;package.name&gt;</text><text x="28" y="325" fill="#edf2f7" font-family="monospace" font-size="15">adb shell service list</text><text x="28" y="348" fill="#edf2f7" font-family="monospace" font-size="15">adb shell cat /proc/&lt;pid&gt;/status</text><text x="28" y="371" fill="#edf2f7" font-family="monospace" font-size="15">adb logcat -d | grep -E 'ActivityTaskManager|am_|GC|lifecycle'</text></svg>